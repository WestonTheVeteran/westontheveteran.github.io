<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search DFW Homes | WestonTheVeteran</title>
  <meta name="description" content="Search North Texas homes for sale with WestonTheVeteran. Explore MLS listings in Arlington and throughout DFW.">

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7f7f7;
      color: #222;
    }

    header {
      background: #15283e;
      color: white;
      padding: 22px 6%;
    }

    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    nav a {
      color: white;
      text-decoration: none;
      font-weight: bold;
    }

    h1 { margin-bottom: 10px; }

    .intro {
      text-align: center;
      padding: 32px 18px;
    }

    .intro p { line-height: 1.6; }

    .search-container {
      width: 96%;
      max-width: 1500px;
      margin: 0 auto 40px;
      background: white;
    }

    iframe {
      display: block;
      width: 100%;
      height: 850px;
      border: none;
    }

    footer {
      text-align: center;
      padding: 25px;
      background: #15283e;
      color: white;
    }

    @media (max-width: 600px) {
      iframe { height: 750px; }
    }
  </style>
</head>

<body>
  <header>
    <nav>
      <strong>WestonTheVeteran</strong>
      <a href="/">Home</a>
    </nav>
  </header>

  <main>
    <section class="intro">
      <h1>Search Homes Across North Texas</h1>
      <p>
        Explore homes for sale in Arlington, Fort Worth,
        Dallas, Mansfield, Grand Prairie, and surrounding
        communities.
      </p>
    </section>

    <div class="search-container">
      <iframe
        src="https://ntrdd.mlsmatrix.com/Matrix/public/IDX.aspx?idx=4b83fba"
        title="North Texas MLS Home Search"
        loading="eager"
        referrerpolicy="strict-origin-when-cross-origin">
      </iframe>
    </div>
  </main>

  <footer>
    <p>WestonTheVeteran | On Demand Realty</p>
    <p>Serving those who served; finding homes for Heroes.</p>
    <p>
      <a href="/" style="color:white;">Return to Homepage</a>
    </p>
